name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    env:
      # The tests never launch the desktop app, so they do not need its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Packages contain only what they should
        run: |
          npm pack --dry-run -w catalyst-q
          npm pack --dry-run -w catalyst-q-cli
          npm pack --dry-run -w catalyst-q-mcp
